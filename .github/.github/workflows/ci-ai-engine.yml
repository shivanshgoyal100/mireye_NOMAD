name: CI - AI & Decision Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-engine/**"
      - ".github/workflows/ci-ai-engine.yml"
  push:
    branches: [main]
    paths:
      - "ai-engine/**"

jobs:
  test-ai-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Sanity-check scoring/ranking outputs
        run: python -m scripts.validate_recommendations
        continue-on-error: true
